<ul id="completed-list" class="task-list">
    {% for task in tasks %}
    <li class="task-item">
        <label class="task-check">
            <input type="checkbox"
                   checked
                   data-post="/tasks/{{ task.id }}/toggle?from=completed"
                   data-target="#completed-list"
                   data-swap="outerHTML">
            <span class="done">{{ task.text }}</span>
        </label>
        <button class="icon-btn danger"
                data-delete="/tasks/{{ task.id }}?from=completed"
                data-target="#completed-list"
                data-swap="outerHTML"
                title="Delete">
            ✕
        </button>
    </li>
    {% else %}
    <li class="empty-state">No completed tasks yet.</li>
    {% endfor %}
</ul>
