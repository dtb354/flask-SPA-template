<nav class="tabs">
    {% for item in nav %}
    <a class="{{ 'active' if active == item.key else '' }}"
       href="{{ item.url }}"
       data-get="{{ item.url }}"
       data-target="#page"
       data-swap="innerHTML"
       data-push="true">
        {{ item.label }}
    </a>
    {% endfor %}
</nav>
